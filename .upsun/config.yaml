# Composer-managed WordPress on Upsun, with project source in gg/.

applications:
  gg:
    source:
      root: "gg"

    type: "php:8.4"

    runtime:
      extensions:
        - redis

    build:
      flavor: composer

    dependencies:
      php:
        wp-cli/wp-cli-bundle: "^2.12"
        psy/psysh: "^0.12.19"

    relationships:
      database: "ggdb:mysql"
      rediscache: "redis:redis"
      essearch: "es:elasticsearch"

    # Preserve the data behind the legacy Platform.sh local mounts. Changing
    # these to storage would attach new, empty volumes.
    mounts:
      "wordpress/wp-content/uploads":
        source: instance
        source_path: "uploads"
      "wordpress/wp-content/cache":
        source: instance
        source_path: "cache"

    web:
      locations:
        "/":
          root: "wordpress"
          passthru: "/index.php"
          index:
            - "index.php"
          expires: 600
          scripts: true
          allow: true
          headers:
            X-Content-Type-Options: nosniff
          rules:
            ^composer\.(json|lock)$:
              allow: false
            ^license\.txt$:
              allow: false
            ^readme\.html$:
              allow: false
            ^xmlrpc\.php$:
              allow: false
        "/wp-content/cache":
          root: "wordpress/wp-content/cache"
          scripts: false
          allow: false
          headers:
            X-Content-Type-Options: nosniff
        "/wp-content/uploads":
          root: "wordpress/wp-content/uploads"
          scripts: false
          allow: true
          headers:
            X-Content-Type-Options: nosniff

    hooks:
      deploy: |
        set -e
        bash scripts/deploy.sh
      post_deploy: |
        set -e
        bash scripts/post-deploy.sh

    crons:
      wp-cron:
        spec: "*/5 * * * *"
        cmd: "cd wordpress && wp cron event run --due-now"

services:
  ggdb:
    type: mariadb:11.8
  redis:
    type: redis:8.0
  # ElasticPress search features are active in production.
  es:
    type: elasticsearch:7.10

routes:
  "https://www.gratia.gratis/":
    type: upstream
    upstream: "gg:http"
    cache:
      enabled: true
      cookies:
        - "/^wordpress_logged_in_/"
        - "/^wordpress_sec_/"
        - "wordpress_test_cookie"
        - "/^wp-settings-/"
        - "/^wp-postpass-/"
        - "PHPSESSID"

  "https://gratia.gratis/":
    type: redirect
    to: "https://www.gratia.gratis/"
